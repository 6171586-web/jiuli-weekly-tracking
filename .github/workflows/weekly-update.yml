name: Update weekly valuation

on:
  schedule:
    # GitHub cron uses UTC: 02:00/03:00 = Beijing 10:00/11:00.
    - cron: "0 2 * * 1"
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jiuli-weekly-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this week's update is complete
        if: github.event_name == 'schedule'
        id: update-gate
        run: |
          if node scripts/should-update.mjs; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
      - name: Check QQ mail and update data
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        run: npm run update:weekly
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
      - name: Validate the site
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        run: npm test
      - name: Commit new valuation data
        id: commit
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/tracker.json; then
            echo "No new valuation data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          git commit -m "Update weekly valuation data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-dist
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
